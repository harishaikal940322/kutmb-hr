name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: PHP 8.5.12 / MySQL 26.10.0
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:26.10.0@sha256:7b16ec7caa94ca7e92f4c5ec287de69d2e8738db056ceb629022951a6f6d910b
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kutmb_hr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kutmb_hr_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5.12'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, zip
          coverage: none

      - name: Verify PHP runtime
        run: php -r 'printf("PHP %s\n", PHP_VERSION); exit(PHP_VERSION === "8.5.12" ? 0 : 1);'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vite Plus Linux native binding
        run: npm install --no-save --package-lock=false "@voidzero-dev/vite-plus-$(node -p '`${process.platform}-${process.arch}-gnu`')@1.4.0"

      - name: Generate ephemeral application key
        run: cp .env.example .env && php artisan key:generate --force

      - name: Build frontend assets
        run: npm run build

      - name: Verify disposable MySQL runtime
        env:
          MYSQL_PWD: root
        run: |
          actual_version="$(mysql --host=127.0.0.1 --user=root --database=kutmb_hr_test --batch --skip-column-names --execute='SELECT VERSION()')"
          printf 'MySQL %s\n' "$actual_version"
          [[ "$actual_version" == 26.10.0* ]]

      - name: Apply and verify baseline migrations
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:status

      - name: Verify Laravel PDO connectivity
        run: php bin/verify-database.php

      - name: Run CI checks on MySQL
        run: composer ci:check

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit JavaScript dependencies
        run: npm audit
