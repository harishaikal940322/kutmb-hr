name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: PHP ${{ matrix.php }} / SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate ephemeral application key
        run: cp .env.example .env && php artisan key:generate --force

      - name: Prepare SQLite database
        run: touch database/database.sqlite

      - name: Build frontend assets
        run: npm run build

      - name: Run CI Checks
        run: composer ci:check

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit JavaScript dependencies
        run: npm audit

  mysql-integration:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kutmb_hr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kutmb_hr_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate ephemeral application key
        run: cp .env.example .env && php artisan key:generate --force

      - name: Build frontend assets
        run: npm run build

      - name: Verify disposable MySQL engine
        run: mysql --host=127.0.0.1 --user=root --password=root --database=kutmb_hr_test --execute='SELECT VERSION() AS mysql_version, DATABASE() AS test_database;'

      - name: Apply and verify baseline migrations
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:status

      - name: Verify database connectivity
        run: php bin/verify-database.php

      - name: Run feature and integration tests on MySQL
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit
