services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.server
        init: true
        restart: unless-stopped
        env_file:
            - .env.server
        environment:
            APP_ENV: development
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: ${DB_HOST:?Set DB_HOST in .env.server}
            DB_PORT: ${DB_PORT:-3306}
            DB_URL: ''
            IAM_LOCAL_ACCOUNT_BOOTSTRAP_ENABLED: 'false'
            IAM_LOCAL_USER_DIRECTORY_PREVIEW_ENABLED: 'false'
        networks:
            data: {}
            proxy:
                aliases:
                    - kutmb-hr-app

networks:
    data:
        external: true
        name: shared-data
    proxy:
        external: true
        name: shared-proxy
