services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.server
        init: true
        restart: unless-stopped
        env_file:
            - .env.server
        environment:
            APP_ENV: development
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: ${DB_HOST:?Set DB_HOST in .env.server}
            DB_PORT: ${DB_PORT:-3306}
            DB_URL: ''
            IAM_LOCAL_ACCOUNT_BOOTSTRAP_ENABLED: 'false'
            IAM_LOCAL_USER_DIRECTORY_PREVIEW_ENABLED: 'false'
        ports:
            - '${KUTMB_DEV_BIND_ADDRESS:?Set KUTMB_DEV_BIND_ADDRESS in .env.server}:${KUTMB_DEV_PORT:?Set KUTMB_DEV_PORT in .env.server}:8000'
        networks:
            - data

networks:
    data:
        external: true
        name: shared-data
