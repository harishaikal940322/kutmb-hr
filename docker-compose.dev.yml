services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        user: '${DEV_UID:-1000}:${DEV_GID:-1000}'
        init: true
        working_dir: /var/www/html
        command: >-
            sh -lc 'exec ./node_modules/.bin/concurrently --kill-others
            --names php,vite
            "php artisan serve --host=0.0.0.0 --port=8000"
            "npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173}"'
        expose:
            - '8000'
        ports:
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - node_modules:/var/www/html/node_modules
        environment:
            APP_ENV: local
            APP_DEBUG: 'false'
            APP_URL: ${KUTMB_APP_URL:-http://kutmb-hr.localhost:8080}
            COMPOSER_HOME: /tmp/composer
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_URL: ''
            DEV_UID: ${DEV_UID:-1000}
            DEV_GID: ${DEV_GID:-1000}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            VITE_PORT: ${VITE_PORT:-5173}
            npm_config_cache: /tmp/npm-cache
        networks:
            - proxy
            - data

volumes:
    vendor:
    node_modules:

networks:
    proxy:
        external: true
        name: ${KUTMB_PROXY_NETWORK:-docker_proxy}
    data:
        external: true
        name: ${KUTMB_DATA_NETWORK:-docker_data}
