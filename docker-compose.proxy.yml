services:
    nginx:
        image: nginx:1.30.6-alpine3.24@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
        restart: unless-stopped
        ports:
            - '${KUTMB_PROXY_BIND_ADDRESS:?Set KUTMB_PROXY_BIND_ADDRESS in .env.server}:${KUTMB_PROXY_PORT:?Set KUTMB_PROXY_PORT in .env.server}:80'
        volumes:
            - ./docker/proxy/conf.d:/etc/nginx/conf.d:ro
        networks:
            - proxy

networks:
    proxy:
        external: true
        name: shared-proxy
